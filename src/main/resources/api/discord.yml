paths:
  /discord/leaderboard:
    get:
      tags:
        - Discord
      summary: Get top profiles for Discord Bot
      description: Returns top profiles by category with pagination. Includes the Discord User ID if the profile is linked to a Discord account.
      operationId: getDiscordLeaderboard
      security:
        - ApiKeyAuth: []
      parameters:
        - name: category
          in: query
          required: true
          schema:
            $ref: './common.yml#/components/schemas/StatisticType'
          description: Statistic category to rank by
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Page number (50 results per page)
      responses:
        '200':
          description: Paginated leaderboard results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscordLeaderboardResponse'
        '403':
          description: Invalid or missing API Key
        '500':
          description: Internal server error

  /discord/profiles:
    post:
      tags:
        - Discord
      summary: Get profiles for multiple Discord users
      description: Returns linked game profiles for a batch of Discord User IDs. Max 100 IDs per request.
      operationId: getDiscordProfiles
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiscordBulkProfileRequest'
      responses:
        '200':
          description: Profiles found for the given Discord User IDs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscordBulkProfileResponse'
        '400':
          description: Invalid request (e.g. too many IDs)
        '403':
          description: Invalid or missing API Key

  /discord/verifications/recent:
    get:
      tags:
        - Discord
      summary: Get recently verified users
      description: Returns users who linked their game profile within the last N seconds. Designed for bot polling.
      operationId: getRecentVerifications
      security:
        - ApiKeyAuth: []
      parameters:
        - name: seconds
          in: query
          required: false
          schema:
            type: integer
            minimum: 5
            maximum: 300
            default: 30
          description: Look back window in seconds (default 30, max 300)
      responses:
        '200':
          description: Recently verified users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscordRecentVerificationsResponse'
        '403':
          description: Invalid or missing API Key

  /discord/profile/{discordUserId}:
    get:
      tags:
        - Discord
      summary: Get profile by Discord User ID
      description: Returns the linked game profile for a given Discord User ID if the user has linked their account.
      operationId: getDiscordProfile
      parameters:
        - name: discordUserId
          in: path
          required: true
          schema:
            type: string
          description: Discord User ID (Snowflake)
      responses:
        '200':
          description: Linked profile found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscordProfileResponse'
        '403':
          description: Invalid or missing API Key
        '404':
          description: Discord user not found or not linked to a profile

  /discord/community-events:
    get:
      tags:
        - Discord
      summary: Community events for the Discord Bot
      description: Every configured community event and counter with its latest global value, milestones with reachedAt, rate and ETA.
      operationId: getDiscordCommunityEvents
      responses:
        '200':
          description: Community events retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DiscordCommunityEvent'
        '500':
          description: Internal server error

components:
  schemas:
    CommunityEventType:
      type: string
      enum:
        - EVENT
        - COUNTER

    CommunityEventArt:
      type: object
      description: Game asset names of the event artwork, resolved against the public game assets
      properties:
        background:
          type: string
          nullable: true
        banner:
          type: string
          nullable: true
        cover:
          type: string
          nullable: true
        icon:
          type: string
          nullable: true
        token:
          type: string
          nullable: true

    CommunityEventMilestone:
      type: object
      required:
        - index
        - amount
        - reached
      properties:
        index:
          type: integer
        amount:
          type: integer
          format: int64
        reward:
          type: string
          nullable: true
        label:
          type: string
          nullable: true
        image:
          type: string
          nullable: true
          description: Game asset name, or a site path starting with /
        reached:
          type: boolean
        reachedAt:
          type: string
          format: date-time
          nullable: true

    CommunityEventStep:
      type: object
      required:
        - amount
      properties:
        amount:
          type: integer
          format: int64
        reachedAt:
          type: string
          format: date-time
          nullable: true

    DiscordCommunityEvent:
      type: object
      required:
        - id
        - name
        - type
        - active
        - milestones
        - art
      properties:
        id:
          type: string
          example: extract_escape_plan
        name:
          type: string
          example: Escape the Facility
        type:
          $ref: '#/components/schemas/CommunityEventType'
        active:
          type: boolean
        startsAt:
          type: string
          format: date-time
          nullable: true
        endsAt:
          type: string
          format: date-time
          nullable: true
        currentValue:
          type: number
          format: double
          nullable: true
        sampledAt:
          type: string
          format: date-time
          nullable: true
        milestones:
          type: array
          items:
            $ref: '#/components/schemas/CommunityEventMilestone'
        nextMilestone:
          type: integer
          format: int64
          nullable: true
        ratePerHour:
          type: number
          format: double
          nullable: true
        etaNextMilestone:
          type: string
          format: date-time
          nullable: true
        step:
          type: integer
          format: int64
          nullable: true
        reachedSteps:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/CommunityEventStep'
        art:
          $ref: '#/components/schemas/CommunityEventArt'

    DiscordLeaderboardResponse:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/DiscordLeaderboardEntry'
        currentPage:
          type: integer
        totalPages:
          type: integer
        hasMore:
          type: boolean
        totalResults:
          type: integer

    DiscordLeaderboardEntry:
      type: object
      properties:
        profileId:
          type: string
          format: uuid
        displayName:
          type: string
        prestigeLevel:
          type: integer
        level:
          type: integer
        ranking:
          type: integer
        value:
          type: integer
        seasonTotalInvasionPoints:
          type: integer
        discordUserId:
          type: string
          nullable: true
          description: Discord User ID if the profile is linked to a Discord account

    ActiveReagentSkillType:
      type: string
      enum:
        - STUN
        - XRAY
        - MINE
        - DOOR_BLOCKER
        - HACKER
        - HEAL

    AccountCreationType:
      type: string
      enum:
        - CLOSED_BETA_USER
        - EARLY_ACCESS_USER
        - NORMAL_USER

    DiscordBulkProfileRequest:
      type: object
      required:
        - discordUserIds
      properties:
        discordUserIds:
          type: array
          items:
            type: string
          maxItems: 100
          description: List of Discord User IDs (Snowflakes), max 100

    DiscordBulkProfileResponse:
      type: object
      properties:
        profiles:
          type: array
          items:
            $ref: '#/components/schemas/DiscordBulkProfileEntry'

    DiscordBulkProfileEntry:
      type: object
      properties:
        discordUserId:
          type: string
        profileId:
          type: string
          format: uuid
        displayName:
          type: string
        prestigeLevel:
          type: integer
        level:
          type: integer
        activeReagentSkill:
          $ref: '#/components/schemas/ActiveReagentSkillType'
        invasionRanking:
          $ref: './common.yml#/components/schemas/InvasionRanking'
        totalInvasionMatchesPlayed:
          type: integer
        seasonTotalInvasionPoints:
          type: integer
        platformType:
          $ref: './common.yml#/components/schemas/PlatformType'
        accountCreationType:
          $ref: '#/components/schemas/AccountCreationType'

    DiscordRecentVerificationsResponse:
      type: object
      properties:
        verifications:
          type: array
          items:
            $ref: '#/components/schemas/DiscordVerificationEntry'

    DiscordVerificationEntry:
      type: object
      properties:
        discordUserId:
          type: string
        discordUsername:
          type: string
        profileId:
          type: string
          format: uuid
        displayName:
          type: string
        linkedAt:
          type: string
          format: date-time

    DiscordProfileResponse:
      type: object
      properties:
        profileId:
          type: string
          format: uuid
        displayName:
          type: string
        prestigeLevel:
          type: integer
        level:
          type: integer

        activeReagentSkill:
          $ref: '#/components/schemas/ActiveReagentSkillType'
        invasionRanking:
          $ref: './common.yml#/components/schemas/InvasionRanking'
        totalInvasionMatchesPlayed:
          type: integer
        seasonTotalInvasionPoints:
          type: integer
        platformType:
          $ref: './common.yml#/components/schemas/PlatformType'
        reagentReleases:
          type: integer
        accountCreationType:
          $ref: '#/components/schemas/AccountCreationType'
