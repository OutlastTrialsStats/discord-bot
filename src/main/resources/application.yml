spring:
  application:
    name: totstats-discord-bot
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:5432/totstats
    username: dev
    password: dev
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
  messages:
    basename: messages/messages
    fallback-to-system-locale: false

logging:
  level:
    net.dv8tion.jda.api.requests.RestRateLimiter: ERROR

discord:
  bot:
    token: ${DISCORD_BOT_TOKEN}
  application-id: ${DISCORD_APPLICATION_ID:}
  oauth:
    client-secret: ${DISCORD_CLIENT_SECRET:}

totstats:
  api:
    base-url: https://outlasttrialsstats.com

widget:
  enabled: ${WIDGET_ENABLED:false}
  public-base-url: ${WIDGET_PUBLIC_BASE_URL:}
  refresh-cooldown-ms: 1500
